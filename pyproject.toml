[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "odprti-racuni"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.2",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.122",
    "django-storages==1.14.6",
    "gunicorn==26.2.0",
    "Pillow==13.0.0",
    "sentry-sdk==2.73.0",
    "django-debug-toolbar==8.0.0",
    "django-mptt==0.21.0",
    "martor==1.8.2",
    "python-dateutil==2.9.0",
    "django-markdownx==4.0.11",
    "python-docx==1.2.0",
    "babel==2.18.0",
    "htmldocx==0.0.6",
    "requests==2.34.2"
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "django-stubs==5.2.2",
    "django-stubs-ext==6.1.2",
    "ipython==9.17.1",
    "isort",
    "django-debug-toolbar==8.0.0",
]

[tool.setuptools.packages.find]
include = ["nvo*", "odprti_racuni*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
