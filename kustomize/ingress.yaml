apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: enable-cors
spec:
  headers:
    accessControlAllowOriginList:
      - "https://odprtiracuni-nvo.djnd.si"
      - "https://odprtiracuni-nvo.danesjenovdan.si"
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - "*"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odprti-racuni
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - odprtiracuni-nvo.djnd.si
        - odprtiracuni-nvo.danesjenovdan.si
      secretName: odprti-racuni-tls
  rules:
    - host: odprtiracuni-nvo.djnd.si
      http: &http_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odprti-racuni
                port:
                  number: 8000
    - host: odprtiracuni-nvo.danesjenovdan.si
      http: *http_paths
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odprti-racuni-nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: |
      odprti-racuni-enable-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - files.odprtiracuni-nvo.djnd.si
      secretName: odprti-racuni-nginx-tls
  rules:
    - host: files.odprtiracuni-nvo.djnd.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odprti-racuni-nginx
                port:
                  number: 80
